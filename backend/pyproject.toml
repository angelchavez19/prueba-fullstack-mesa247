[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "black>=26.5.1",
    "cryptography>=50.0.1",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pymysql>=1.2.3",
    "pytest>=9.1.1",
    "sqlmodel>=0.0.42",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
