services:
  mysql:
    image: mysql:8.4
    container_name: mesa247_mysql
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-${DB_NAME:-mesa247_queue_db}}
      MYSQL_USER: ${MYSQL_USER:-${DB_USER:-mesa247_user}}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-${DB_PASSWORD:-mesa247_password}}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-${DB_USER:-mesa247_user}}", "-p${MYSQL_PASSWORD:-${DB_PASSWORD:-mesa247_password}}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
    driver: local
